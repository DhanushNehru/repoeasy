services:
  repoeasy:
    build: .
    container_name: repoeasy
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL:-http://localhost:4000/api/auth/github/callback}
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET (e.g. openssl rand -hex 32)}
    volumes:
      - repoeasy_data:/app/data

volumes:
  repoeasy_data:
